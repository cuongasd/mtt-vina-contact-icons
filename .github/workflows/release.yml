name: Validate and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - run: node --check assets/contact-icons.js && node tests/contact-icons.cjs
      - run: php tests/home-cover.php
      - run: php tests/home-about.php
      - run: node --check assets/home-about.js && node tests/home-about.cjs
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F " * Version: $VERSION" mtt-vina-contact-icons.php
          grep -F "define( 'MTT_VINA_CONTACT_ICONS_VERSION', '$VERSION' );" mtt-vina-contact-icons.php
          grep -Fx "Stable tag: $VERSION" readme.txt
          mkdir -p build/mtt-vina-contact-icons
          cp mtt-vina-contact-icons.php readme.txt README.md DEPENDENCIES.md build/mtt-vina-contact-icons/
          cp -R assets lib build/mtt-vina-contact-icons/
          cd build
          zip -qr "mtt-vina-contact-icons-$VERSION.zip" mtt-vina-contact-icons
      - name: Publish stable release with ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/mtt-vina-contact-icons-${GITHUB_REF_NAME#v}.zip" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
